name: Feature request
description: Suggest an improvement (UI, rules, lobby, etc.)
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a new one. We're mostly focused on language packs right now, but good ideas are always worth hearing.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What pain point does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
