name: Bug report
description: Something broken in the app or game flow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [open issues](https://github.com/aadithyen/kazhutha/issues) first. If yours is new, fill in what you can below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect vs what actually happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open room …
        2. …
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / device
      placeholder: e.g. Chrome 128 on Android, Safari on iPhone
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, console errors, room size, etc.
    validations:
      required: false
