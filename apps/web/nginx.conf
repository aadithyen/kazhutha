server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 512;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Immutable hashed build assets can be cached forever. ^~ skips the regex
    # location below so these don't get the no-cache header instead.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker + manifest must always be revalidated so PWA updates land.
    location ~* \.(?:js|json|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
