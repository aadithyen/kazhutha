services:
  dashboard:
    build:
      context: ./apps/dashboard
    restart: unless-stopped
    volumes:
      - dashboard-data:/data
    environment:
      PORT: 9090
      DATABASE_PATH: /data/kazhutha.db
      SIGNALING_URL: http://signaling:8080
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-dev-change-me}
      ALLOWED_ORIGINS: ${DASHBOARD_ALLOWED_ORIGINS:-}
      RETAIN_DAYS: ${DASHBOARD_RETAIN_DAYS:-30}
      POLL_INTERVAL_MS: ${DASHBOARD_POLL_INTERVAL_MS:-60000}
    depends_on:
      signaling:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9090/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  signaling:
    build:
      context: ./apps/signaling
    restart: unless-stopped
    environment:
      # Optional Cloudflare TURN credentials (see .env.example). When set, the
      # server generates short-lived ICE credentials at GET /ice-servers.
      TURN_API_TOKEN: ${TURN_API_TOKEN:-}
      TURN_KEY_ID: ${TURN_KEY_ID:-}
      TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-86400}
      # Optional comma-separated browser origins allowed to use the tracker and
      # TURN endpoint (e.g. https://play.example.com). Unset allows any origin.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      MIN_CLIENT_VERSION: ${MIN_CLIENT_VERSION:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-kazhutha-signaling}
      TELEMETRY_IP_HASH_SALT: ${TELEMETRY_IP_HASH_SALT:-}
      DASHBOARD_INGEST_URL: ${DASHBOARD_INGEST_URL:-http://dashboard:9090}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-dev-change-me}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # Browser-reachable address of the signalling server. Set
        # VITE_SIGNALING_URL to your public WebSocket URL when deploying.
        VITE_SIGNALING_URL: ${VITE_SIGNALING_URL:-ws://localhost:8080}
        VITE_APP_VERSION: ${APP_VERSION:-0.1.0}
        VITE_ANALYTICS_URL: ${VITE_ANALYTICS_URL:-}
        VITE_ANALYTICS_KEY: ${DASHBOARD_API_KEY:-dev-change-me}
    depends_on:
      signaling:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  dashboard-data:
